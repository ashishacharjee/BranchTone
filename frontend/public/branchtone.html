function explore(B={depth:12,routes:50,states:500}){
 const out=[],q=[{p:'P-001',f:[],path:['P-001']}];let seen=0,trunc=false;
 while(q.length){const s=q.shift();if(++seen>B.states){trunc=true;break}
  const ps=P(s.p),f=new Set(s.f);if(ps.reveal)f.add(ps.reveal.fact);
  const nx=M.edges.filter(e=>e[0]===s.p).map(e=>e[1]);
  if(!nx.length){if(out.length<B.routes)out.push({path:s.path,facts:[...f]});else trunc=true;continue}
  for(const n of nx){if(s.path.includes(n))continue;if(s.path.length>=B.depth){trunc=true;continue}q.push({p:n,f:[...f],path:[...s.path,n]})}}
 out.forEach((r,i)=>r.name='Route '+String.fromCharCode(65+i));
 return{routes:out,seen,trunc}}
// per-route simulation: events in order, knowledge before each passage
function simulate(route){
 const ev=[];let facts=new Set(),k=0;
 route.path.forEach((pid,ix)=>{const ps=P(pid),before=new Set(facts);
  ev.push({k:k++,pid,type:'enter',t:ix*10,txt:'Enter '+ps.n});
  if(ps.reveal){facts.add(ps.reveal.fact);ev.push({k:k++,pid,type:'reveal',t:ix*10,ord:ps.reveal.ord,txt:'Reveal: '+ps.reveal.fact+' = true'})}
  M.cues.filter(c=>c.p===pid).forEach(c=>{let v='pass',why='no protected fact';
   if(c.requires){const known=before.has(c.requires);
    if(known){v='pass';why=c.requires+' known before entry'}
    else if(ps.reveal&&ps.reveal.fact===c.requires){if(c.ord==null){v='unverified';why='same-passage order metadata missing'}else if(c.ord>ps.reveal.ord){v='pass';why='cue ord '+c.ord+' after reveal ord '+ps.reveal.ord}else{v='fail';why='cue fires before reveal in passage'}}
    else{v='fail';why=c.requires+' = false when cue fires'}}
   ev.push({k:k++,pid,type:'cue',t:ix*10,cue:c,v,why,facts:[...before],txt:'Cue '+c.asset+' ('+c.layer+', entry)'})});});
 return ev}

 const ex=explore(),f=[];let n=0;
 ex.routes.forEach(r=>simulate(r).filter(e=>e.type==='cue'&&e.cue.requires&&e.v!=='pass').forEach(e=>f.push({id:'BT-00'+(++n),rule:'Reveal Protection',cat:'Narrative Protection',sev:e.v==='fail'?'High':'Medium',route:r.name,p:e.pid,cue:e.cue.asset,res:e.v,expl:e.v==='fail'?'The traitor theme starts before the character\u2019s identity is established on this route.':'Event order inside the passage is unknown; ordering cannot be verified.',ev:e.why,src:'story.twee :: '+e.pid})));
 Object.keys(M.assets).forEach(a=>{if(!M.assets[a].up&&M.cues.some(c=>c.asset===a)){const cs=M.cues.filter(c=>c.asset===a),ps=cs.map(c=>c.p);f.push({id:'BT-00'+(++n),rule:'Missing Media Asset',cat:'Audio Integrity',sev:'Medium',route:ex.routes.filter(r=>r.path.some(p=>ps.includes(p))).map(r=>r.name.slice(-1)).join('+'),p:ps.join(','),cue:a,res:'fail',expl:a+' is referenced by a cue but no binary was uploaded.',ev:'asset.up=false; cues '+cs.map(c=>c.id).join(','),src:'cue map :: '+cs.map(c=>c.id).join(',')})}});
 f.forEach(x=>x.status=(S.fs[x.cat+x.cue+x.route]||'Open'));
 return{findings:f,ex}}
